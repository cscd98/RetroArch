image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu:latest

default:
  interruptible: true

stages:
  - build

build-retroarch-libounce-aarch64:
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-libounce-devkitpro:latest
  stage: build
  variables:
    MEDIA_PATH: .media
  before_script:
    - export NUMPROC=$(($(nproc)/3))
  artifacts:
    paths:
    - retroarch.nro
    - retroarch.elf
    - ${MEDIA_PATH}
    expire_in: 10 min
  dependencies: []
  script:
    - "make clean"
    - "make -f Makefile.libounce -j$NUMPROC"
    - "mkdir -p ${MEDIA_PATH}/${CI_PROJECT_NAME}/filters/video"
    - "mkdir -p ${MEDIA_PATH}/${CI_PROJECT_NAME}/pkg"
    - "cp -f gfx/video_filters/*.filt ${MEDIA_PATH}/${CI_PROJECT_NAME}/filters/video"
    - "cp -f pkg/libnx/retroarch.jpg ${MEDIA_PATH}/${CI_PROJECT_NAME}/pkg"
